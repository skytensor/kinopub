<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль</title>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=edit,logout"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>

<div class="profile_hero">
    <div class="hero-bg"></div>
    <div class="overlay"></div>

    <div class="content">
        <img
                src="https://avatars.mds.yandex.net/get-kino-vod-users-avatar/1520427/181940664-56-794492.jpg/240x240"
                alt="icon"
                class="profile-avatar"
        />

        <div class="profile-info">
            <div class="profile-main-info">
                <h1 th:text="${#authentication.name}"></h1>
                <p th:text="${email}" class="profile-email"></p>
            </div>

            <div class="profile-stats">
                <div class="profile-stats-left">
                    <div class="profile-stats-block">
                        <p class="profile-stats-number" th:text="${ratings}"></p>
                        <p class="profile-stats-btext">оценки</p>
                    </div>

                    <div class="profile-stats-block">
                        <p class="profile-stats-number" th:text="${bookmarks.size()}"></p>
                        <p class="profile-stats-btext">закладки</p>
                    </div>

                    <div class="profile-stats-block">
                        <p class="profile-stats-number" th:text="${watchedMovies.size()}"></p>
                        <p class="profile-stats-btext">фильмы и сериалы</p>
                    </div>
                </div>

                <div class="profile-stats-buttons">
                    <button class="profile-icon-button">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                    <form th:action="@{/logout}" method="post">
                        <button class="profile-icon-button" type="submit">
                            <span class="material-symbols-outlined"> logout </span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="profile-main">
    <div class="profile-views">
        <div>
            <h2>Оценки и просмотры</h2>

            <div class="movies-scroll">
                <div th:each="movie : ${watchedMovies}" class="profile_movie_card">
                    <a th:href="@{/movies/{slug}(slug=${movie.getSlug()})}">
                        <img
                            th:src="${movie.getPosterUrl()}"
                            alt=""
                        />
                    </a>


                    <div class="movie_info">
                        <h3 class="card_title" th:text="${movie.getTitle()}"></h3>
                        <p class="card_description" th:text="${movie.getYear()} + '•' + ${movie.getGenre()}"></p>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <h2>Закладки</h2>
            <div class="movies-scroll">
                <div th:each="movie : ${bookmarks}" class="profile_movie_card">
                    <a th:href="@{/movies/{slug}(slug=${movie.getSlug()})}">
                        <img
                                th:src="${movie.getPosterUrl()}"
                                alt=""
                        />
                    </a>

                    <div class="movie_info">
                        <h3 class="card_title" th:text="${movie.getTitle()}"></h3>
                        <p class="card_description" th:text="${movie.getYear()} + '•' + ${movie.getGenre()}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
