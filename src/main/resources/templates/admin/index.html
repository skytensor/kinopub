<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<table>
  <tr th:each="movie : ${movies}">
    <td th:text="${movie.title}"></td>

    <td>
      <a th:href="@{/admin/movies/edit/{id}(id=${movie.id})}">
        Изменить
      </a>
    </td>

    <td>
      <form th:action="@{/admin/movies/delete/{id}(id=${movie.id})}"
            method="post">

        <button>Удалить</button>

      </form>
    </td>
  </tr>
</table>

<a href="/admin/movies/new">
  Добавить фильм
</a>
</body>
</html>
