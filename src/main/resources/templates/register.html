<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>

  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="login-bg">
<div class="login-container">
  <div class="login-card">
    <a th:href="@{/}" class="logo-link"><h1 class="logo">KINOPUB</h1></a>

    <div class="login-input">
      <div class="login-text">
        <h2>Зарегистрироваться</h2>
        <p>Введите данные для регистрации</p>
      </div>

      <form th:action="@{/register}" th:object="${registerForm}" method="post" class="login-form">
        <input type="text" th:field="*{login}" placeholder="Логин" class="login-inputtext" />
        <p class="form-error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></p>

        <input type="email" th:field="*{email}" placeholder="Почта" class="login-inputtext" />
        <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <input type="password" th:field="*{password}" placeholder="Пароль" class="login-inputtext"/>
        <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <input type="password" th:field="*{confirmPassword}" placeholder="Повторить пароль" class="login-inputtext"/>
        <p class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

        <button type="submit" class="login-button">Зарегистрироваться</button>
      </form>
      <a class="register-button" th:href="@{/login}">Войти</a>
    </div>
  </div>
</div>
</body>
</html>
